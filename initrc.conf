ECHO "Initrc for Kimi's OS" # Prints a string to the debug log
MODULE boot/part_mgr.elf
MODULE boot/idm.elf # Loads and executes a module located at the path
MODULE boot/ifsm.elf
# This is a comment
#     source file    dest  offset
# MOUNT /dev/disk/ide0 /home 0x1000 # this is hexadecimal
                          #  4096   this is decimal
                          #0010000  this is octal
MOUNT /dev/disk/ide0 /sys
SYSINIT # initialize uninitialized systems. Immutable after call. Must be included
EXEC /sys/exectest # Execute program in userland. If this program terminates without spawning any other processes, the system will idle indefinitely.

END # Ends the initrc. 
